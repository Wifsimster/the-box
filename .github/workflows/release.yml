name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  DOCKER_IMAGE: wifsimster/the-box

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    name: Decide release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      new_version: ${{ steps.version.outputs.new_version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      build_date: ${{ steps.build_date.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture build timestamp
        id: build_date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Determine bump type from conventional commits
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: bumping $VERSION_TYPE"
            echo "bump_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            SUBJECTS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"%s" --no-merges)
            BODIES=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"%b" --no-merges)
          else
            SUBJECTS=$(git log --pretty=format:"%s" --no-merges)
            BODIES=$(git log --pretty=format:"%b" --no-merges)
          fi

          if [ -z "$SUBJECTS" ]; then
            echo "No commits since ${PREVIOUS_TAG:-repo start} — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits since ${PREVIOUS_TAG:-repo start}:"
          echo "$SUBJECTS" | sed 's/^/  /'
          echo ""

          # Major: a conventional commit subject marked breaking with `!` or any
          # commit body containing the BREAKING CHANGE footer.
          if echo "$SUBJECTS" | grep -qE "^[a-z]+(\([^)]+\))?!:" \
             || echo "$BODIES" | grep -q "BREAKING CHANGE:"; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP=minor
          elif echo "$SUBJECTS" | grep -qE "^(fix|perf|revert|refactor)(\([^)]+\))?:"; then
            BUMP=patch
          else
            echo "Only non-releasable commits (chore/docs/style/test/ci/build) — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Bump type: $BUMP"
          echo "bump_type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: version
        if: steps.bump.outputs.should_release == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.bump_type }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          # Strict semver guard: this value flows into downstream shell
          # steps, git tags and docker tags — reject anything unexpected.
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in package.json: $CURRENT" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Current: $CURRENT → New: $NEW_VERSION ($BUMP)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, Build, Test
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Test
        run: npm test

      - name: Stripe price sync check
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "STRIPE_SECRET_KEY not configured — skipping stripe:check"
            exit 0
          fi
          npm run stripe:check --workspace @the-box/backend -- --live

  build:
    name: Build ${{ matrix.platform }}
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache_scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.decide.outputs.new_version }}
            BUILD_DATE=${{ needs.decide.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digest-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release & manifest
    needs: [decide, checks, build]
    if: needs.decide.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: "npm"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          NEW_VERSION: ${{ needs.decide.outputs.new_version }}
          MINOR: ${{ needs.decide.outputs.minor }}
          MAJOR: ${{ needs.decide.outputs.major }}
          SHORT_SHA: ${{ needs.decide.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${DOCKER_IMAGE}:latest" \
            --tag "${DOCKER_IMAGE}:v${NEW_VERSION}" \
            --tag "${DOCKER_IMAGE}:${MINOR}" \
            --tag "${DOCKER_IMAGE}:${MAJOR}" \
            --tag "${DOCKER_IMAGE}:sha-${SHORT_SHA}" \
            $(printf "${DOCKER_IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          NEW_VERSION: ${{ needs.decide.outputs.new_version }}
        run: |
          docker buildx imagetools inspect "${DOCKER_IMAGE}:v${NEW_VERSION}"

      - name: Bump version files
        env:
          BUMP_TYPE: ${{ needs.decide.outputs.bump_type }}
        run: |
          npm run "version:${BUMP_TYPE}"
          echo "Bumped to $(node -p "require('./package.json').version")"

      - name: Generate changelog
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE_ARGS=("${PREVIOUS_TAG}..HEAD")
          else
            RANGE_ARGS=()
          fi

          {
            echo "## What's Changed"
            echo ""
            git log "${RANGE_ARGS[@]}" --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            echo "### Features"
            FEATURES=$(git log "${RANGE_ARGS[@]}" --pretty=format:"%s (%h)" --no-merges \
              | grep -E "^feat(\(.+\))?:" \
              | sed -E 's/^feat(\(.+\))?:[[:space:]]*/- /' || true)
            if [ -n "$FEATURES" ]; then
              echo "$FEATURES"
            else
              echo "_No new features_"
            fi
            echo ""
            echo "### Bug Fixes"
            FIXES=$(git log "${RANGE_ARGS[@]}" --pretty=format:"%s (%h)" --no-merges \
              | grep -E "^fix(\(.+\))?:" \
              | sed -E 's/^fix(\(.+\))?:[[:space:]]*/- /' || true)
            if [ -n "$FIXES" ]; then
              echo "$FIXES"
            else
              echo "_No bug fixes_"
            fi
          } > CHANGELOG_TEMP.md

          cat CHANGELOG_TEMP.md

      - name: Commit version bump and tag
        env:
          NEW_VERSION: ${{ needs.decide.outputs.new_version }}
        run: |
          git add package.json packages/*/package.json package-lock.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"

      - name: Push changes to repository
        env:
          NEW_VERSION: ${{ needs.decide.outputs.new_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" HEAD:main
          git push "$REMOTE" "v${NEW_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ needs.decide.outputs.new_version }}
          name: Release v${{ needs.decide.outputs.new_version }}
          body_path: CHANGELOG_TEMP.md
          draft: false
          prerelease: false

      - name: Notify release
        env:
          NEW_VERSION: ${{ needs.decide.outputs.new_version }}
          MINOR: ${{ needs.decide.outputs.minor }}
          MAJOR: ${{ needs.decide.outputs.major }}
          SHORT_SHA: ${{ needs.decide.outputs.short_sha }}
        run: |
          echo "Released version ${NEW_VERSION}"
          echo "Docker images published:"
          echo "  - ${DOCKER_IMAGE}:latest"
          echo "  - ${DOCKER_IMAGE}:v${NEW_VERSION}"
          echo "  - ${DOCKER_IMAGE}:${MINOR}"
          echo "  - ${DOCKER_IMAGE}:${MAJOR}"
          echo "  - ${DOCKER_IMAGE}:sha-${SHORT_SHA}"
