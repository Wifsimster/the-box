<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Box — open state: today's box has not been played yet
       (docs/brand.md §4). Same geometry as logo.svg with the lid lifted
       and the body's top rim drawn, so the box reads as open rather than
       as a detached shape. -->
  <defs>
    <linearGradient id="boxEdgeOpen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <g stroke="url(#boxEdgeOpen)" stroke-width="16" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Lifted lid -->
    <polygon points="256,52 432,142 256,232 80,142"/>
    <!-- Open rim of the body -->
    <line x1="80" y1="170" x2="256" y2="260"/>
    <line x1="432" y1="170" x2="256" y2="260"/>
    <!-- Vertical edges -->
    <line x1="256" y1="260" x2="256" y2="432"/>
    <line x1="80" y1="170" x2="80" y2="342"/>
    <line x1="432" y1="170" x2="432" y2="342"/>
    <!-- Bottom edges -->
    <line x1="80" y1="342" x2="256" y2="432"/>
    <line x1="256" y1="432" x2="432" y2="342"/>
  </g>
</svg>
